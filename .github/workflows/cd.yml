name: CD - Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/happyheadlines

jobs:
 
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HappyHeadlines.sln

      - name: Build
        run: dotnet build HappyHeadlines.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HappyHeadlines.sln --configuration Release --no-build --verbosity normal

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          
    strategy:
      fail-fast: false
      matrix:
        service:
          - ArticleService
          - ArticleCacheService
          - ArticleQueue
          - CommentService
          - CommentCache
          - ProfanityService
          - DraftService
          - NewsletterService
          - PublisherService
          - SubscriberService
          - SubscriberCache
          - WebApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_PREFIX }}/${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: "Build & push (tag: latest + git SHA, FMEA )"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-smoke-test:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f docker-compose.yml up -d

      - name: Wait & verify health
        run: |
          sleep 45
          docker compose ps
          curl -fsS http://localhost:80/health || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  deploy:
    needs: integration-smoke-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: echo "Deploying to production..."

