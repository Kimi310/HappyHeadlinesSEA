name: CI/CD – Build, Test & Deliver

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/happyheadlines

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HappyHeadlines.sln

      - name: Build solution
        run: dotnet build HappyHeadlines.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test HappyHeadlines.sln -c Release --no-build --verbosity normal

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ArticleService
          - ArticleCacheService
          - ArticleQueue
          - CommentService
          - CommentCache
          - DraftService
          - NewsletterService
          - ProfanityService
          - PublisherService
          - WebApp
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start all services with docker-compose
        run: docker compose up -d --wait --wait-timeout 120

      - name: Wait for services to be healthy
        run: sleep 30

      - name: Smoke test – WebApp health
        run: curl --fail --retry 5 --retry-delay 5 http://localhost:80/health || true

      - name: Tear down
        if: always()
        run: docker compose down -v
