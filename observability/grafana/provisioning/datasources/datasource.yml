apiVersion: 1

datasources:
  - name: CacheStats
    uid: cache-stats
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://article-cache-service:80
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # When a log line contains a trace id, expose a link that jumps to Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:trace_id|traceID|TraceId)\"?[:=]\\s*\"?([a-f0-9]+)"
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Trace -> Logs: jump from a span in Tempo to the matching logs in Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        tags:
          - key: service.name
            value: app
      nodeGraph:
        enabled: true

